<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#dce4ed;background:#0b1017;font-size:13px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #79dfc3;outline-offset:3px}button{color:inherit;background:transparent;border:1px solid #303d4b;border-radius:7px;padding:10px 14px}button:hover{background:#24303d}input,select{width:100%;color:#e6edf6;background:#101720;border:1px solid #354150;padding:11px 12px;border-radius:6px;outline-color:#70d3bc}label{display:block;color:#aebbc9;font-size:12px}label input,label select{margin-top:8px}h1,h2,p{margin:0}h1{font-size:30px;letter-spacing:-1px;font-weight:600}h2{font-size:15px;font-weight:550}small,.muted{color:#8594a7}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#7b92a4;font-weight:650}.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.3px;font-size:16px}.mark{width:29px;height:29px;border:1px solid #62c3b3;transform:rotate(30deg);border-radius:8px;display:grid;place-items:center;color:#79dfc3}.mark:after{content:'';width:11px;height:11px;border:1px solid #79dfc3;border-radius:50%}.sub{margin-top:10px;color:#8d9daf;line-height:1.7}.pill{font-size:10px;color:#8cccb9;border:1px solid #34564e;background:#16302b;border-radius:20px;padding:5px 9px;white-space:nowrap}.line{height:1px;background:#27303d;margin:24px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:21px}.wide{grid-column:1/-1}.hint{display:block;font-size:11px;margin-top:7px;color:#718498;line-height:1.5}.primary{background:#81d5bd;color:#102b26;border-color:#81d5bd;font-weight:650}.primary:hover{background:#a1e6d2}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.number{display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid #3a4d50;color:# /* A: persistent workspace rail and contextual right panel */
.a{display:grid;grid-template-columns:205px 1fr}.a aside{background:#101720;border-right:1px solid #25303e;padding:30px 18px}.a aside .eyebrow{margin:45px 12px 16px}.a .railbottom{margin:95px 12px 0;line-height:1.8}.a main{max-width:1220px;padding:32px 38px;width:100%;margin:auto}.a .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.a .connection{background:#121d27;border:1px solid #263340;padding:19px;border-radius:10px;margin:25px 0}.a .bodygrid{display:grid;grid-template-columns:minmax(280px,1fr) 235px;gap:30px}.a .panel{border:1px solid #2b3845;border-radius:10px;padding:23px;background:#121a24}.a .preview{background:#111a23;border:1px solid #283442;border-radius:10px;padding:20px;align-self:start}.a .preview p{font-size:12px;color:#8b9daf;line-height:1.8}.a .preview h2{margin-bottom:12px}

.b{background:#14151d;color:#e5e1f0}.b header{padding:24px 5%;border-bottom:1px solid #32303f;display:flex;align-items:center;justify-content:space-between}.b .mark{border-color:#a49bdd}.b main{max-width:850px;margin:40px auto;padding:0 30px}.b .steps{display:flex;gap:0;margin:30px 0}.b .steps button{flex:1;border:0;border-radius:0;border-bottom:2px solid #363141;text-align:left;color:#858095;padding:14px 0}.b .steps button.selected{border-color:#b7a8ef;color:#d0c1ff}.b .stage{background:#1c1c27;border:1px solid #353143;border-radius:14px;padding:30px}.b input,.b select{background:#151620;border-color:#444051}.b .primary{background:#c2b2f0;border-color:#c2b2f0;color:#28203c}.b .connection{margin:24px 0}.b .workflowtabs{display:flex;gap:8px;margin-bottom:28px}.b .workflowtabs button.active{background:#363044;border-color:#9682c4}.b .foot{border-color:#393342}.b .guide{display:flex;gap:15px;padding:18px;background:#242332;border-radius:8px;margin-top:25px;line-height:1.8;color:#a9a1bd;font-size:12px}

.c{background:#10171b}.c header{padding:18px 28px;border-bottom:1px solid #314048;display:flex;align-items:center;justify-content:space-between}.c main{padding:26px 30px;max-width:1440px;margin:auto}.c .worktabs{display:flex;gap:20px;border-bottom:1px solid #33464b;margin:24px 0}.c .worktabs button{border:0;border-radius:0;padding:13px 0}.c .worktabs button.active{border-bottom:2px solid #d7b879;color:#e4ce9e}.c .connection{padding:15px 0 24px;border-bottom:1px solid #334048}.c .sheet{display:grid;grid-template-columns:1.3fr 1fr 1fr;margin-top:25px}.c .sheet section{padding:0 24px;border-right:1px solid #334148}.c .sheet section:first-child{padding-left:0}.c .sheet section:last-child{border:0;padding-right:0}.c .sheet .fields{grid-template-columns:1fr;gap:17px}.c input,.c select{border-radius:2px;padding:9px;background:#121e23;border-color:#3a4e56}.c .number{border-radius:0;color:#dbbf87;border-color:#61563e}.c .primary{background:#dbc18b;border-color:#dbc18b;color:#2d281c;border-radius:3px}.c .readout{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #35454c;margin:26px 0 0}.c .readout div{padding:17px;border-right:1px solid #35454c;font-family:monospace}.c .readout small{display:block;margin-bottom:8px;font-family:Inter,sans-serif}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#eaf0f4;color:#18232d;border-radius:13px;box-shadow:0 8px 40px #0008;padding:8px;display:flex;align-items:center;gap:8px;z-index:10;width:max-content;max-width:95vw}.switcher button{border:0;color:#283642;padding:10px}.switcher button:hover{background:#ccd8e1}.switcher strong{font-size:12px}.switcher small{color:#657484;display:block;font-size:10px;margin-top:3px}.switcher .chosen{background:#d4dfe7}.state{padding:15px 28px;color:#748b9a;font:10px monospace;border-top:1px solid #27313a;overflow-wrap:anywhere}.notice{padding:10px 20px;text-align:center;background:#17212d;color:#a4b4c6;font-size:11px;letter-spacing:.3px}
@media(min-width:1500px){.a main{padding-top:60px}}@media(max-width:1050px){.a .bodygrid{grid-template-columns:1fr}.a .preview{display:none}.a main{padding:28px}.c .sheet{grid-template-columns:1fr 1fr}.c .sheet section:last-child{grid-column:1/-1;padding:25px 0 0;margin-top:25px;border-top:1px solid #334148}.c .sheet section:nth-child(2){border:0}.c .sheet section:last-child .fields{grid-template-columns:1fr 1fr}}@media(max-width:780px){.a{display:block}.a aside{padding:16px;border-right:0;border-bottom:1px solid #25303e;display:flex;gap:8px;flex-wrap:wrap}.a aside .brand{width:100%;margin-bottom:10px}.a aside .eyebrow,.a .railbottom{display:none}.a .navbtn{width:auto;margin:0}.fields{grid-template-columns:1fr}.connection{grid-template-columns:1fr 1fr}.connection label:first-child{grid-column:1/-1}.a main,.c main{padding:22px 18px}.c .sheet{display:block}.c .sheet section,.c .sheet section:first-child{border:0;padding:0 0 24px}.c .sheet section:last-child .fields{grid-template-columns:1fr}.b main{padding:0 18px;margin-top:25px}.b .stage{padding:20px}.b header,.c header{padding:18px}.toolbar .mock{display:none}h1{font-size:25px}.switcher{gap:0}.switcher button{padding:9px}.switcher strong{font-size:11px}.switcher small{font-size:9px}}
/* Style candidates: deliberately distinct visual languages. */
.a{background:radial-gradient(ellipse at 95% 0%,#19354b 0,transparent 45%),#0b111c}.a aside{background:#0c1523}.a .panel{background:#111e2e;border-color:#294157;box-shadow:0 14px 35px #0002}.a .primary{background:#6fd9d2;border-color:#6fd9d2;color:#08272a}.a h1{letter-spacing:-1.2px}.a .preview{background:linear-gradient(155deg,#193343,#101a2b)}
.b{color-scheme:light;background:#f4f1e9;color:#33362e;font-family:Georgia,'Times New Roman',serif}.b header{border-color:#d9d8cb;background:#faf8f2}.b .brand,.b button,.b label,.b small,.b .eyebrow,.b .sub,.b .guide,.b input,.b select{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.b h1{font-size:44px;font-weight:400;letter-spacing:-1.5px}.b h2{font-size:22px;font-weight:400}.b .mark{border-color:#7c8869;border-radius:0}.b .mark:after{border-color:#7c8869}.b .eyebrow{color:#7f826a}.b .sub,.b .muted,.b small,.b .hint{color:#7c8071}.b .stage{background:#fffef9;border:1px solid #deddd0;border-radius:3px;box-shadow:0 12px 35px #66633809}.b input,.b select{color:#343d30;background:#fafaf4;border-color:#d6d9ca;border-radius:3px}.b label{color:#536047}.b button{border-color:#d1d5c5;border-radius:3px;color:#536047}.b button:hover{background:#e7ebdc}.b .primary{color:#fffef5;background:#627450;border-color:#627450}.b .primary:hover{background:#4f6140}.b .workflowtabs button.active{background:#e5ebda;border-color:#acb99c;color:#35472b}.b .steps button{border-color:#dcded1;color:#979b8a}.b .steps button.selected{border-color:#697d53;color:#52633f}.b .guide{background:#edf0e3;color:#738063;border-radius:2px}.b .pill{background:#edf0e3;color:#63704f;border-color:#d9e0cc}.b details,.b .foot{border-color:#dcded3}.b summary{color:#5e6c52}.b .line{background:#dcded3}.b .status{color:#657752}.b .status:before{color:#7c925c}
.c{background:#080a09;color:#c6d5c8;font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:12px}.c header{border-color:#354538;background:#101610}.c .brand{font-family:inherit;letter-spacing:-1px;text-transform:uppercase}.c .mark{border-radius:0;border-color:#a7ed69;transform:none}.c .mark:after{border-color:#a7ed69;border-radius:0}.c h1{font-family:inherit;text-transform:uppercase;font-size:27px;letter-spacing:-1px}.c h2{font-family:inherit;text-transform:uppercase;font-size:12px}.c .eyebrow,.c .mock{color:#80967b}.c .pill{background:transparent;color:#b6f27c;border-color:#5b7c47;border-radius:0}.c input,.c select{background:#101710;border-color:#394b39;color:#c7e8b5;font-family:inherit}.c label,.c summary{color:#a2b39d}.c .sub,.c .hint,.c small{color:#70856d}.c .primary{background:#b2ec7b;border-color:#b2ec7b;color:#18210e;border-radius:0;text-transform:uppercase}.c .primary:hover{background:#d2ffa7}.c button{border-radius:0;font-family:inherit}.c button:hover{background:#263622}.c .worktabs button.active{border-color:#b2ec7b;color:#b2ec7b}.c .number{color:#b2ec7b;border-color:#526941}.c .sheet section,.c .connection,.c .worktabs,.c .readout,.c .readout div,.c .foot,.c details{border-color:#2b3e2e}.c .readout{background:#101710}.c .readout div{color:#b2ec7b}.c .status{color:#8baf76}.c .status:before{color:#b2ec7b}.c .log{color:#9bc57e;background:#030603;border-radius:0}.c .readout small{font-family:inherit}
</style>
<div class="notice">DESIGN PROTOTYPE · Sample values · No connection or job submission</div><div id="app"></div><div id="switcher" class="switcher"></div>
<script>
const names={A:'深海科技 · Abyss',B:'暖白極簡 · Atelier',C:'黑底終端 · Terminal'};
const state={variant:['A','B','C'].includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'A',workflow:'orientation',step:0,values:{url:'https://cryosparc.example.org',project:'P42',workspace:'W7',select_job:'J128',refinement_job:'J204',volume_job:'J204',symmetry:'I',classes:'3, 8, 12',axis_family:'2fold, 3fold, 5fold',top_n:'5'},status:'Ready to configure'};
const brand=`<div class="brand"><span class="mark"></span>2D Projection</div>`;
function field(key,label,help='',options){return `<label>${label}${options?`<select data-key="${key}">${options.map(x=>`<option ${state.values[key]===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input data-key="${key}" value="${state.values[key]||''}" placeholder="${key==='surface_level'?'Automatic':'Default'}">`}${help?`<span class="hint">${help}</span>`:''}</label>`}
function connection(){return `<div class="connection">${field('url','CryoSPARC URL *')}${field('project','Project UID *')}${field('workspace','Workspace UID *')}</div>`}
function basics(){return field('select_job','Select 2D job UID *','Selected class averages')+(state.workflow==='orientation'?field('refinement_job','Refinement job UID *','Source of the refined map and particle poses')+field('symmetry','Symmetry','', ['I','C1'])+field('classes','Interactive class numbers','Optional. All selected classes are matched.'):field('volume_job','Volume job UID *','Source of the refined map')+field('axis_family','Axis families','Blank includes all supported families.')+field('top_n','Top classes per axis'))}
function advanced(){return `<details><summary>Search settings <small> · Defaults</small></summary><div class="fields">${field('search_resolution','Search resolution (Å)')}${field('shift','Maximum shift (px)')}</div></details><details><summary>Rendering <small> · Automatic surface</small></summary><div class="fields">${field('surface_level','Surface level','Presentation only')}${field('render_grid_size','Surface sampling grid size','Blank uses the native grid.')}</div></details><details><summary>Output <small> · CryoSPARC workspace</small></summary><p class="sub">Results are published to the selected workspace.</p></details>`}
function nav(cls=''){return `<div class="${cls}"><button class="navbtn ${state.workflow==='orientation'?'active':''}" data-flow="orientation"><span>◈</span>Class Orientation</button><button class="navbtn ${state.workflow==='axis'?'active':''}" data-flow="axis"><span>◎</span>Axis Search</button></div>`}
function title(){return state.workflow==='orientation'?'Class Orientation':'Axis Search'}
function subtitle(){return state.workflow==='orientation'?'Bring your 2D classes into perspective.':'Find the classes closest to each symmetry axis.'}
function footer(){return `<div class="foot"><div class="actions"><span class="status">${state.status}</span><button data-action="command">View command</button><button class="primary" data-action="run">Preview run →</button></div><details style="margin-top:18px"><summary>Activity log <small> · Simulation</small></summary><div class="log">Prototype session · No backend connected<br>${state.status}</div></details><div id="feedback"></div></div>`}
function VariantA(){return `<div class="shell a"><aside>${brand}<div class="eyebrow">Workflows</div>${nav()}<div class="railbottom"><small>WORKSPACE</small><p>P42 / W7</p><small>Settings are local to this preview.</small></div></aside><main><div class="top"><span class="eyebrow">Workspace launcher</span><span class="pill">Design A · Recommended</span></div><h1>${title()}</h1><p class="sub">${subtitle()}</p>${connection()}<div class="bodygrid"><div class="panel"><div class="sectionhead"><h2><span class="number">01</span>Source & configuration</h2><small>* Required</small></div><div class="fields">${basics()}</div><div class="line"></div>${advanced()}</div><div class="preview"><div class="eyebrow">What you’ll get</div><div class="diagram"><div class="orb"></div><span class="muted">→</span><div class="orb"></div></div><h2>A view for each class</h2><p>Class Average<br>Matched Projection<br>Camera View Render</p><div class="line"></div><p>Full results remain in your CryoSPARC workspace.</p><span class="hint">Abstract illustration · not scientific data</span></div></div>${footer()}</main></div>`}
function VariantB(){return `<div class="shell b"><header>${brand}<span class="mock">WORKSPACE LAUNCHER</span></header><main><div class="eyebrow">A focused workflow</div><h1 style="margin-top:12px">${title()}</h1><p class="sub">One clear step at a time.</p>${nav('workflowtabs')}<div class="steps">${['Connect','Configure','Review'].map((x,i)=>`<button class="${state.step===i?'selected':''}" data-step="${i}">0${i+1} &nbsp; ${x}</button>`).join('')}</div><div class="stage">${state.step===0?`<div class="sectionhead"><h2>Your CryoSPARC workspace</h2><span class="pill">Step 1 of 3</span></div><p class="sub">Choose where your results will be published.</p>${connection()}<div class="guide">↗ <span>Use the same server and saved login as your command-line workflow.<br>This preview will not connect to the server.</span></div>`:state.step===1?`<div class="sectionhead"><h2>Choose your inputs</h2><small>Step 2 of 3</small></div><div class="fields">${basics()}</div><div class="line"></div>${advanced()}`:`<h2>Ready for a closer look</h2><p class="sub">${title()} · ${state.values.project} / ${state.values.workspace}<br>Selected classes from ${state.values.select_job}</p><div class="guide">Results: Class Average · Matched Projection · Camera View Render<br>All values in this prototype are illustrative.</div>${footer()}`}</div><div class="actions" style="margin-top:20px"><button data-step="${Math.max(0,state.step-1)}">← Back</button><span class="muted">${state.step+1} / 3</span><button class="primary" data-step="${Math.min(2,state.step+1)}">${state.step===2?'Review configuration':'Continue →'}</button></div></main></div>`}
function VariantC(){return `<div class="shell c"><header>${brand}<div class="toolbar"><span class="mock">CONFIGURATION CONSOLE</span><button data-action="settings">Session settings</button></div></header><main><div class="sectionhead"><div><span class="eyebrow">Workspace / P42 / W7</span><h1 style="margin-top:10px">Configure a run</h1></div><span class="pill">Sample session</span></div>${nav('worktabs')}${connection()}<div class="sheet"><section><div class="sectionhead"><h2><span class="number">01</span>Inputs</h2></div><div class="fields">${basics()}</div></section><section><div class="sectionhead"><h2><span class="number">02</span>Search</h2></div><p class="sub" style="margin-bottom:22px">${title()}</p>${advanced()}</section><section><div class="sectionhead"><h2><span class="number">03</span>Presentation</h2></div><div class="fields">${field('surface_level','Surface level','Automatic when blank')}${field('render_grid_size','Surface sampling grid size','Native grid when blank')}</div><p class="sub" style="font-size:12px;margin-top:25px">Results → CryoSPARC workspace<br>Class Average / Matched Projection / Camera View Render</p></section></div><div class="readout"><div><small>WORKFLOW</small>${state.workflow==='axis'?'AXIS SEARCH':'ORIENTATION'}</div><div><small>INPUT</small>${state.values.select_job}</div><div><small>STATE</small>PREVIEW</div></div>${footer()}</main></div>`}
function render(){document.getElementById('app').innerHTML=({A:VariantA,B:VariantB,C:VariantC}[state.variant])()+`<div class="state">PROTOTYPE STATE · ${JSON.stringify(state).replaceAll('<','&lt;')}</div>`;document.getElementById('switcher').innerHTML=`<button data-cycle="-1" aria-label="Previous variant">←</button><div><strong>${state.variant} — ${names[state.variant]}</strong><small>拋棄式原型 · ← → 切換 · 縮放視窗可比較布局</small></div>${Object.keys(names).map(x=>`<button class="${state.variant===x?'chosen':''}" data-variant="${x}">${x}</button>`).join('')}<button data-cycle="1" aria-label="Next variant">→</button>`}
function switchTo(v){state.variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);render()}
function cycle(n){switchTo(['A','B','C'][(['A','B','C'].indexOf(state.variant)+n+3)%3])}
document.addEventListener('input',e=>{if(e.target.dataset.key){state.values[e.target.dataset.key]=e.target.value;document.querySelector('.state').textContent='PROTOTYPE STATE · '+JSON.stringify(state)}});
document.addEventListener('change',e=>{if(e.target.dataset.key)state.values[e.target.dataset.key]=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.variant)switchTo(d.variant);if(d.cycle)cycle(+d.cycle);if(d.flow){state.workflow=d.flow;render()}if(d.step!==undefined){state.step=+d.step;render()}if(d.action==='run'){const missing=['url','project','workspace','select_job',state.workflow==='orientation'?'refinement_job':'volume_job'].filter(k=>!state.values[k].trim());state.status=missing.length?'Check required fields':'Preview complete · No job submitted';render();document.getElementById('feedback').textContent=missing.length?'Required: '+missing.join(', '):'Simulation only. In the finished app this action starts the selected workflow.'}if(d.action==='command'){document.getElementById('feedback').textContent='Command preview · Workflow: '+state.workflow+' · Project: '+state.values.project+' · Workspace: '+state.values.workspace}if(d.action==='settings'){state.status='Settings stay in memory for this preview';render()}});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});window.addEventListener('popstate',()=>{state.variant=new URLSearchParams(location.search).get('variant')||'A';render()});render();
</script></html>
