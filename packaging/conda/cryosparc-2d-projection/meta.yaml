{% set project = load_file_data('pyproject.toml') %}
package:
  name: cryosparc-2d-projection
  version: {{ project['project']['version'] }}
source:
  path: ../../..
build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
  entry_points:
{% for command, target in project.get('project', {}).get('scripts', {}).items() %}
    - {{ command }} = {{ target }}
{% endfor %}
requirements:
  host:
    - python 3.12.*
    - pip
    - setuptools >=69
  run:
    - python >=3.12,<3.13
{% for dependency in project.get('project', {}).get('dependencies', []) %}
{% if dependency.startswith('cryosparc-tools') %}
    - cryosparc-tools >=5.0.0,<5.1
{% else %}
    - {{ dependency }}
{% endif %}
{% endfor %}
test:
  source_files:
    - packaging/smoke_test.py
  commands:
    - python packaging/smoke_test.py
about:
  home: https://github.com/030kuroneko/cryosparc2Dprojection
  summary: Map CryoSPARC 2D classes to 3D viewing directions
