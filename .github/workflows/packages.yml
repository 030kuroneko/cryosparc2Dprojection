name: Build and publish packages

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI and the configured Anaconda channel
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Release tag must match pyproject.toml version'
          PY
      - name: Build wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install and check both distributions outside the checkout
        run: |
          for package in "$GITHUB_WORKSPACE"/dist/*; do
            python -m venv "$RUNNER_TEMP/package-test"
            "$RUNNER_TEMP/package-test/bin/python" -m pip install "$package"
            (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/package-test/bin/python" "$GITHUB_WORKSPACE/packaging/smoke_test.py")
            rm -rf "$RUNNER_TEMP/package-test"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  conda:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: packaging
          python-version: '3.12'
          channels: conda-forge
          channel-priority: strict
      - name: Install build tools
        run: conda install --yes --override-channels -c conda-forge conda-build conda-index
      - name: Build and test dependency and application packages
        run: |
          conda build packaging/conda/cryosparc-tools --python 3.12 --override-channels -c conda-forge --output-folder "$RUNNER_TEMP/conda-channel" --no-anaconda-upload
          conda index "$RUNNER_TEMP/conda-channel"
          conda build packaging/conda/cryosparc-2d-projection --python 3.12 --override-channels -c "file://$RUNNER_TEMP/conda-channel" -c conda-forge --output-folder "$RUNNER_TEMP/conda-channel" --no-anaconda-upload
          conda index "$RUNNER_TEMP/conda-channel"
          conda create --yes --prefix "$RUNNER_TEMP/installed-package" --override-channels -c "file://$RUNNER_TEMP/conda-channel" -c conda-forge cryosparc-2d-projection
          cd "$RUNNER_TEMP"
          conda run --prefix "$RUNNER_TEMP/installed-package" python "$GITHUB_WORKSPACE/packaging/smoke_test.py"
      - uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/conda-channel/**/*.conda
            ${{ runner.temp }}/conda-channel/**/*.tar.bz2
          if-no-files-found: error

  publish-pypi:
    needs: [python, conda]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-conda:
    needs: [python, conda]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: anaconda
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: conda-*
          path: conda-packages
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install anaconda-client
      - name: Publish Conda packages
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
          ANACONDA_USER: ${{ vars.ANACONDA_USER }}
        run: |
          test -n "$ANACONDA_API_TOKEN" || { echo 'Configure ANACONDA_API_TOKEN in the anaconda environment'; exit 1; }
          test -n "$ANACONDA_USER" || { echo 'Configure ANACONDA_USER in the anaconda environment'; exit 1; }
          find conda-packages -type f \( -name '*.conda' -o -name '*.tar.bz2' \) -print0 | xargs -0 anaconda upload --user "$ANACONDA_USER" --skip-existing
