[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cryosparc-2d-projection"
version = "0.1.0"
description = "Map CryoSPARC 2D classes to 3D viewing directions."
requires-python = ">=3.10,<3.13"
dependencies = [
    "cryosparc-tools~=5.0.0",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "scikit-image>=0.24,<1",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
cryosparc-2d-projection = "cryosparc_2d_projection.cli:main"
cryosparc-506-convention-fixture = "cryosparc_2d_projection.live_fixture:main"
cryosparc-axis-search = "cryosparc_2d_projection.axis_cli:main"
cryosparc-update = "cryosparc_2d_projection.update_cli:main"

[tool.setuptools]
packages = ["cryosparc_2d_projection"]
package-dir = { cryosparc_2d_projection = "src" }

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:skimage.measure",
]
